name: CI/CD Pipeline

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

jobs:

  # code verification
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: 
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: crud_db_test
        ports: 
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout respository
        uses: actions/checkout@v4
      
      # backend test setup
      - name: Setup nodejs 
        uses: actions/setup-node@v4
        with: 
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Run backend syntax check
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: testpassword
          PGDATABASE: crud_db_test
          PGPORT: 5432
        run: |
          cd backend
          node -e "console.log('backend code parsed cleanly.');"

      # front end build
      - name: Setup nodejs 
        uses: actions/setup-node@v4
        with: 
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & run build
        run: |
          cd frontend
          npm install 
          npm run build
  
  build-and-push:
    name: Build & push docker Images
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout respository
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # Extract metadata (tags, labels) for Backend
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/crud-backend
          tags: |
            type=sha,format=short
            type=raw,value=latest

      # Extract metadata (tags, labels) for Frontend
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/crud-frontend
          tags: |
            type=sha,format=short
            type=raw,value=latest

      # Build and push Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    

