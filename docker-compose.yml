version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crud_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=crud_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - crud-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crud_backend
    restart: always
    environment:
      PORT: 5000
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres123
      PGDATABASE: crud_app
      PGPORT: 5432
    ports:
      - 5000:5000
    depends_on:
      - postgres
    networks:
      - crud-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crud_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - crud-net

networks:
  crud-net:
    driver: bridge

volumes:
  pgdata: